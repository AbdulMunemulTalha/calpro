<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#0a0f1e"/>
  <meta name="google-adsense-account" content="ca-pub-2580237448099674"/>

  <title>CalPro — Financial, Health & Crypto Calculators</title>

  <!-- GA4 — load first, non-blocking -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LNG3FJF7BX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-LNG3FJF7BX', { anonymize_ip: true });
  </script>

  <!-- AdSense — async so it never blocks render -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2580237448099674" crossorigin="anonymous"></script>

  <!-- Fonts: preconnect first for DNS warmup -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

  <!--
    Non-blocking font load strategy:
    1. media="print" trick loads font CSS without blocking render
    2. onload switches it to all media once loaded
    3. <noscript> fallback for no-JS browsers
    4. &display=swap prevents invisible text during load
  -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    media="print"
    onload="this.media='all'"/>
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"/>
  </noscript>

  <!-- System font fallback — shows instantly while web fonts load -->
  <style>
    :root {
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }
    /* Critical above-fold styles to prevent layout shift */
    body { margin: 0; background: #070b14; color: #f1f5f9; font-family: var(--font-body); }
    #root { min-height: 100vh; }
    /* Prevent invisible text while fonts load */
    * { font-display: swap; }
  </style>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>
</html>
